# Pinned versions for the OpenG2P local developer stack.
# Override individual refs in .env if needed.
#
# Application image pins below are the single source of truth for Docker Compose.
# Sync into .env with: make sync-images

workspace:
  default_path: ../openg2p-workspace

repos:
  odoo:
    url: https://github.com/odoo/odoo.git
    ref: "17.0"
    path: odoo17

  pbms:
    url: https://github.com/OpenG2P/pbms.git
    ref: develop
    path: pbms

  odoo_commons:
    url: https://github.com/OpenG2P/openg2p-odoo-commons.git
    ref: develop
    path: openg2p-odoo-commons

  registry_platform:
    url: https://gitlab.com/openg2p/registry/registry-platform.git
    ref: "1.2"
    path: registry-platform

  iam_service:
    url: https://github.com/OpenG2P/iam-service.git
    ref: develop
    path: iam-service

  master_data_service:
    url: https://gitlab.com/openg2p/master-data-service.git
    ref: develop
    path: master-data-service

  openg2p_data:
    url: https://github.com/OpenG2P/openg2p-data.git
    ref: develop
    path: openg2p-data

  farmer_registry:
    url: https://gitlab.com/openg2p/registry/farmer-registry.git
    ref: "1.3"
    path: farmer-registry
    extension_path: farmer-extension

  national_social_registry:
    url: git@gitlab.com:mowsa1/nsr/national-social-registry.git
    ref: "1.1.3"
    path: national-social-registry
    extension_path: nsr-extension

  village_social_security_registry:
    url: https://github.com/asierNebiyou/openg2p-registry-vsss-extensions.git
    ref: develop
    path: village-social-security-registry
    extension_path: openg2p-registry-vsss-extension

  g2p_bridge:
    url: https://github.com/OpenG2P/g2p-bridge.git
    ref: develop
    path: g2p-bridge

  spar:
    url: https://github.com/OpenG2P/spar.git
    ref: develop
    path: spar

  awe:
    url: https://gitlab.com/openg2p/awe.git
    ref: develop
    path: awe

# The registry-platform version every registry product image is built FROM.
# A variant's thin Dockerfiles pin this as ARG RP_VERSION and its Helm chart
# pins the matching openg2p-registry chart dependency. The shared registry staff
# UI image below is published at this same version, so it must carry this tag —
# a UI from a different platform build is the classic "blank dropdowns / 401"
# failure. Check coherence with: make check-pins
registry_platform_version: 1.2.2-rc.557

images:
  # Pins match rancher2.openg2p.org namespace nsr (Docker Hub), not GitLab.
  # Catalog / shared hub (app launcher with links to Farmer, NSR, …)
  staff_portal_ui: openg2p/openg2p-staff-portal-ui:1.2.0

  # Shared registry product UI image (Farmer + NSR each run their own container)
  registry_staff_portal_ui: openg2p/openg2p-registry-staff-ui:1.2.2-rc.557

  # Commons
  iam_staff_portal_api: openg2p/iam-staff-portal-api:1.4.4-rc.125
  master_data_api: openg2p/master-data-api:1.1.4-rc.104
  awe_api: openg2p/openg2p-awe:1.2.2
  awe_ui: openg2p/openg2p-awe-ui:1.2.2

  # Farmer Registry -- 1.2.1-rc.190 is what the qa namespace runs (was pinned
  # at 1.2.0, which is not what any deployed environment uses).
  farmer_registry_staff_api: openg2p/openg2p-farmer-registry-staff-api:1.2.1-rc.190
  farmer_registry_partner_api: openg2p/openg2p-farmer-registry-partner-api:1.2.1-rc.190
  farmer_registry_celery: openg2p/openg2p-farmer-registry-celery:1.2.1-rc.190
  farmer_registry_db_seed: openg2p/openg2p-farmer-registry-db-seed:1.2.1-rc.190

  # National Social Registry (Docker Hub — same tags as rancher2 nsr)
  nsr_staff_api: openg2p/openg2p-mowsa-nsr-staff-portal-api:1.2.1-rc.335
  nsr_partner_api: openg2p/openg2p-mowsa-nsr-partner-api:1.2.1-rc.335
  nsr_celery: openg2p/openg2p-mowsa-nsr-celery:1.2.1-rc.335
  nsr_db_seed: openg2p/openg2p-mowsa-nsr-db-seed:1.2.1-rc.335
  # NSR staff UI (compose uses REGISTRY_STAFF_PORTAL_UI_IMAGE for NSR UI container)
  # (registry_staff_portal_ui set above to 1.2.2-rc.544)

  # Village Social Security System (VSSS)
  # Pinned, not :develop — a floating tag means `docker compose up` can silently
  # get a different build than the one `make docker-vsss-build` produced, and
  # `docker image inspect` can never tell whether the local image is current.
  # These match helm/vsss/Chart.yaml appVersion and the vsss-extension version.
  # Not published under openg2p/ yet: build them locally with
  #   make docker-vsss-build
  # which builds from the VSSS repo's thin Dockerfiles at REGISTRY_PLATFORM_VERSION.
  vsss_staff_api: openg2p/openg2p-vsss-staff-portal-api:1.2.0
  vsss_partner_api: openg2p/openg2p-vsss-partner-api:1.2.0
  vsss_celery: openg2p/openg2p-vsss-celery:1.2.0
  vsss_db_seed: openg2p/openg2p-vsss-db-seed:1.2.0

  # Other stack images
  pbms: openg2p/openg2p-pbms-core:develop
  g2p_bridge_partner_api: openg2p/g2p-bridge-partner-api:develop
  g2p_bridge_bene_api: openg2p/g2p-bridge-bene-portal-api:develop
  g2p_bridge_celery: openg2p/g2p-bridge-celery:develop
  g2p_bridge_example_bank: openg2p/openg2p-g2p-bridge-example-bank-api:develop
  postgres: postgres:16
  redis: redis:7-alpine
  # Pinned: `latest` made the local stack non-reproducible across rebuilds.
  minio: minio/minio:RELEASE.2025-04-22T22-12-26Z
  keycloak: quay.io/keycloak/keycloak:26.0
  id_generator: openg2p/openg2p-id-generator:1.1.2

profiles:
  infra:
    description: Shared Postgres, Redis, MinIO, Keycloak
    compose_profiles: [infra]

  commons:
    description: Shared IAM + AWE containers for registry Docker stacks
    requires: [infra]
    compose_profiles: [infra, with-redis, commons]

  pbms:
    description: PBMS Odoo (native or container)
    requires: [infra]
    compose_profiles: [infra, pbms]

  farmer_registry:
    description: Farmer Registry Gen2 (platform + farmer-extension)
    requires: [infra, commons]
    compose_profiles: [infra, with-redis, commons, farmer-registry]

  national_social_registry:
    description: National Social Registry Gen2 (platform + nsr-extension)
    requires: [infra, commons]
    compose_profiles: [infra, with-redis, commons, nsr-registry]

  village_social_security_registry:
    description: Village Social Security System Gen2 (platform + vsss-extension)
    requires: [infra, commons]
    compose_profiles: [infra, with-redis, commons, vsss-registry]

  bridge:
    description: G2P Bridge APIs, Celery, example bank
    requires: [infra]
    compose_profiles: [infra, bridge]

  spar:
    description: SPAR mapper and beneficiary portal APIs
    requires: [infra]
    compose_profiles: [infra, spar]

  awe:
    description: Approval Workflow Engine for registry CR/intake approvals
    requires: [infra]
    compose_profiles: [infra, commons]

  docker_registry:
    description: Docker-only Farmer + NSR + IAM + AWE
    requires: [infra, commons]
    compose_profiles: [infra, with-redis, commons, farmer-registry, nsr-registry]

  full:
    description: All infrastructure and containerized apps
    requires: [infra, commons, pbms, farmer_registry, national_social_registry, bridge, spar]
    compose_profiles: [infra, with-redis, commons, pbms, farmer-registry, nsr-registry, bridge, spar]
