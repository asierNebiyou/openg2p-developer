name: openg2p-developer

# Shared infrastructure for all OpenG2P local profiles.
# Start with: make infra-up

services:
  postgres:
    profiles: [infra, commons, pbms, farmer-registry, nsr-registry, farmer-registry-seed, nsr-registry-seed, bridge, spar, full]
    image: postgres:16
    container_name: openg2p-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    profiles: [with-redis, commons, pbms, farmer-registry, nsr-registry, bridge, full]
    image: redis:7-alpine
    container_name: openg2p-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    profiles: [infra, commons, farmer-registry, nsr-registry, farmer-registry-seed, nsr-registry-seed, full]
    image: minio/minio:latest
    container_name: openg2p-minio
    # Buckets are plain directories under /data, so create them here and drop
    # the separate minio-init container, which ran `mc mb` and always exited 1:
    # its default bucket name was `default_bucket`, and S3 names cannot contain
    # an underscore. Because that first `mc mb` ran under `set -e` with no
    # `|| true`, it also skipped creating `templates` and `registrant-photos`,
    # so on a fresh volume the seed's template upload had nowhere to write.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/"${MINIO_BUCKET_NAME:-default-bucket}" \
                 /data/templates \
                 /data/registrant-photos
        exec minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-adminsecret}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-default-bucket}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    profiles: [infra, commons, pbms, farmer-registry, nsr-registry, farmer-registry-seed, nsr-registry-seed, bridge, spar, full]
    image: quay.io/keycloak/keycloak:26.0
    platform: linux/amd64
    container_name: openg2p-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      # Keycloak 26 hostname-v2: full frontend URL so OIDC metadata always
      # advertises localhost for browsers even when IAM fetches via keycloak DNS.
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8080}"
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ../keycloak/realm-export:/opt/keycloak/data/import:ro
      # start-dev keeps its H2 store under /opt/keycloak/data/h2, which lives in
      # the container filesystem. Without a volume here every `docker compose up`
      # that recreates this container (each profile stage does) wipes the realm
      # contents, and keycloak-init has to recreate ~11 clients, their roles and
      # the dev users from scratch — several minutes per stage, during which IAM
      # and the UIs are up against an empty realm. The realm-export mount cannot
      # cover for it: staff-realm.json declares no clients and no users.
      #
      # Mounted at /data, NOT at /data/h2: the image ships /opt/keycloak/data
      # (keycloak:root 0775) but not the h2/ subdir, which start-dev creates at
      # runtime. Docker seeds a fresh named volume from the image directory it
      # shadows, so /data inherits keycloak ownership and is writable; a volume
      # at /data/h2 has no image dir to seed from, stays root-owned, and
      # Keycloak dies with AccessDeniedException on keycloakdb.trace.db.
      # The import bind mount above is nested deeper, so it still applies.
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      # First boot against the persistent keycloak_data volume runs the full
      # Liquibase migration (148 change sets) and the realm import before the
      # port opens — measured at 127s here, against ~40s when H2 lived in the
      # container filesystem and was thrown away each time. The old 30s grace
      # had infra fail with "dependency failed to start: container
      # openg2p-keycloak is unhealthy" while Keycloak was still starting
      # normally. Later boots reuse the migrated volume and are quick; this
      # only has to cover the first one.
      start_period: 240s
    restart: unless-stopped

  id-generator:
    profiles: [infra, commons, farmer-registry, nsr-registry, farmer-registry-seed, nsr-registry-seed, full]
    image: ${ID_GENERATOR_IMAGE:-openg2p/openg2p-id-generator:1.1.2}
    platform: linux/amd64
    container_name: openg2p-id-generator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: idgenerator
      DB_USER: ${POSTGRES_SUPERUSER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CONFIG_PATH: /app/config/default.yaml
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
      UVICORN_LOG_LEVEL: info
    ports:
      - "${ID_GENERATOR_PORT:-8040}:8000"
    volumes:
      - ../config/id-generator/default.yaml:/app/config/default.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/idgenerator/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  keycloak-init:
    profiles: [infra, commons, pbms, farmer-registry, nsr-registry, farmer-registry-seed, nsr-registry-seed, bridge, spar, full]
    image: quay.io/keycloak/keycloak:26.0
    platform: linux/amd64
    container_name: openg2p-keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_PORT: "8080"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-staff}
      KEYCLOAK_IAM_CLIENT_SECRET: ${KEYCLOAK_IAM_CLIENT_SECRET:-dev-iam-staff-secret}
      KEYCLOAK_DEV_USER: ${KEYCLOAK_DEV_USER:-staff}
      KEYCLOAK_DEV_PASSWORD: ${KEYCLOAK_DEV_PASSWORD:-staff}
      KEYCLOAK_AWE_APPROVER_PASSWORD: ${KEYCLOAK_AWE_APPROVER_PASSWORD:-pass}
      IAM_STAFF_PORT: ${IAM_STAFF_PORT:-8020}
      FARMER_REGISTRY_UI_PORT: ${FARMER_REGISTRY_UI_PORT:-3001}
      NSR_REGISTRY_UI_PORT: ${NSR_REGISTRY_UI_PORT:-3002}
      STAFF_PORTAL_UI_PORT: ${STAFF_PORTAL_UI_PORT:-3000}
      PBMS_HTTP_PORT: ${PBMS_HTTP_PORT:-8069}
      G2P_BRIDGE_API_PORT: ${G2P_BRIDGE_API_PORT:-8002}
      SPAR_MAPPER_API_PORT: ${SPAR_MAPPER_API_PORT:-8004}
      SPAR_BENE_API_PORT: ${SPAR_BENE_API_PORT:-8005}
      OPENG2P_WORKSPACE: /workspace
    volumes:
      - ../scripts/keycloak-init.sh:/keycloak-init.sh:ro
      - ../scripts/keycloak-ensure-extension-clients.sh:/keycloak-ensure-extension-clients.sh:ro
      - ../scripts/lib/extension-manifest.sh:/scripts/lib/extension-manifest.sh:ro
      # extension-manifest.sh sources this and calls workspace_open; without it
      # the source fails, workspace_open is undefined, and every manifest lookup
      # resolves against / instead of the workspace — so the extension-client
      # step finds no .openg2p-extension.yaml and silently does nothing.
      - ../scripts/lib/workspace-path.sh:/scripts/lib/workspace-path.sh:ro
      - ../scripts/lib/keycloak-registry-roles.sh:/scripts/lib/keycloak-registry-roles.sh:ro
      - ${OPENG2P_WORKSPACE:-../openg2p-workspace}:/workspace:ro
    entrypoint: ["/bin/bash", "/keycloak-init.sh"]
    restart: "no"

volumes:
  postgres_data:
  minio_data:
  keycloak_data:
